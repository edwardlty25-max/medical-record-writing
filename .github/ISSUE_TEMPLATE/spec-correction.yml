name: 规范纠错
description: 报告规范条款、时限或来源有误（请附原文依据）
title: "[规范纠错] "
labels: ["spec"]
body:
  - type: dropdown
    id: doc
    attributes:
      label: 涉及文件
      options:
        - references/rules.md
        - references/admission-note.md
        - references/first-progress-note.md
        - references/progress-note.md
        - references/discharge-summary.md
        - references/transfer-and-death.md
        - scripts/validate_note.py
        - 其他
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前写法
      description: 粘贴仓库中现有的表述
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 应改为
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 来源（文件名称 + 文号/年份 + 链接）
      description: 规范类纠错必须填写来源；无法提供的请说明原因
    validations:
      required: true
  - type: input
    id: hospital
    attributes:
      label: 本院现行执行版本（可选）
      description: 你所在医院现行版本的名称与年份
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我确认未包含患者真实信息
          required: true
