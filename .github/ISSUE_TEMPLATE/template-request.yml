name: 模板请求
description: 请求新增文书模板或字段
title: "[模板] "
labels: ["template"]
body:
  - type: input
    id: name
    attributes:
      label: 文书名称
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与频率
    validations:
      required: true
  - type: textarea
    id: fields
    attributes:
      label: 必需字段
      description: 按医院现行格式列出
  - type: input
    id: source
    attributes:
      label: 格式依据（可选）
      description: 制度文件名称或文号
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我确认未包含患者真实信息
          required: true
