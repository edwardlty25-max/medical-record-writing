name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 链接与 frontmatter 检查
        run: python scripts/check_links.py
      - name: 校验器回归测试
        run: python scripts/run_tests.py
